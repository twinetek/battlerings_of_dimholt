<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Battlerings Beta Smoke Test</title>
<style>body { font: 14px/1.4 ui-monospace, Consolas, monospace; margin: 16px; } iframe { width: 1200px; height: 900px; border: 1px solid #ccc; }</style>
</head>
<body>
<h1>Battlerings beta: smoke test</h1>
<p>Opens the beta drop-down (?beta=true), picks the hex battlefield, then plays it through the real UI: copy the main game, fight on the hex battlefield, use tester controls.
  Note: this overwrites the main autosave and the beta autosave in this browser.</p>
<pre id="out"></pre>
<iframe id="game"></iframe>
<script type="module">
import { createCharacter } from '../js/rules/character.js';
import { buyWeapon, buyArmor } from '../js/rules/town.js';
import { newGameState } from '../js/engine/state.js';
import { rangeProfile } from '../js/rules/ranged.js';
import { moveStats } from '../js/rules/character.js';

const out = document.getElementById('out');
const frame = document.getElementById('game');
const log = (ok, msg) => out.insertAdjacentText('beforeend', `${ok ? 'PASS' : 'FAIL'} ${msg}\n`);
const wait = ms => new Promise(r => setTimeout(r, ms));
const errors = [];

// A main-game save for the beta to copy (written directly, as the main game would).
const c = createCharacter('Smokey', { str: 16, int: 10, wis: 10, dex: 15, con: 15, cha: 10 });
c.gold = 500; buyWeapon(c, 'long-sword'); buyArmor(c, 'chain'); c.hp = 9999;
const mainState = newGameState(c);
localStorage.removeItem('dimholt-hex-battlefield.save.auto');
localStorage.setItem('dimholt.save.auto', JSON.stringify({ format: 'dimholt-save', version: mainState.version, savedAt: new Date().toISOString(), summary: 'Smokey', state: mainState }));
const mainBefore = localStorage.getItem('dimholt.save.auto');

let stage = 'menu';
frame.addEventListener('load', async () => {
  const w = frame.contentWindow;
  const d = frame.contentDocument;
  if (stage === 'menu') {
    // The main game with ?beta=true shows the drop-down; pick the hex battlefield.
    await wait(400);
    const select = d.querySelector('#beta-select');
    const option = select && [...select.options].find(o => o.value.startsWith('hex_battlefield/'));
    log(!!option, 'main title shows the beta drop-down with ?beta=true');
    if (!option) { document.body.dataset.done = 'yes'; return; }
    select.value = option.value;
    stage = 'beta';
    d.querySelector('[data-action="openBeta"]').dispatchEvent(new MouseEvent('click', { bubbles: true }));
    return;
  }
  w.addEventListener('error', e => errors.push(e.message));
  w.addEventListener('unhandledrejection', e => errors.push(String(e.reason)));
  w.confirm = () => true;
  await wait(400);
  const q = sel => d.querySelector(sel);
  const click = async sel => {
    const el = q(sel);
    if (!el) throw new Error(`No element ${sel}`);
    el.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    await wait(60);
  };
  const screen = () => q('#screen').dataset.screen;
  const st = () => JSON.parse(localStorage.getItem('dimholt-hex-battlefield.save.auto')).state;
  try {
    log(w.location.pathname.endsWith('/hex_battlefield/') && !!q('.beta-badge') && q('.kicker').textContent.includes('Battlefield tester'), 'opening it lands on the hex battlefield beta');
    log(!!q('[data-action="continue"]') && st().character.name === 'Smokey', 'main game was copied into the beta');
    log(!!q('[data-action="copyMain"]') && [...q('#beta-select').options].some(o => o.value === '../?beta=true'), 'copy control, and the drop-down leads back to the main game');
    await click('[data-action="continue"]');
    // The beta's Weaponsmith sells throwing axes and shows how far everything throws; buy two.
    await click('[data-to="weapons"]');
    log(q('#screen').textContent.includes('Throwing Axe') && q('#screen').textContent.includes('Thrown: full power to'), 'the beta weaponsmith sells throwing axes and shows throwing numbers');
    const axesBefore = st().character.weapons.filter(x => x.id === 'throwing-axe').length;
    await click('[data-action="buy"][data-id="throwing-axe"]');
    await click('[data-action="buy"][data-id="throwing-axe"]');
    log(st().character.weapons.filter(x => x.id === 'throwing-axe').length === axesBefore + 2, 'bought two throwing axes');
    await click('[data-action="go"][data-to="town"]');
    await click('[data-to="guide"]');
    const guideText = q('#screen').textContent.replace(/\s+/g, ' ');
    log(screen() === 'guide' && guideText.includes('five daggers are five throws') && guideText.includes('Two-Handed Sword: full power to 1 hex, -4 to hit'),
      'the beta guide explains throwing any weapon and how well each flies');
    await click('[data-action="go"][data-to="town"]');
    await click('[data-to="arena"]');
    await click('tr[data-id="kobold"]');
    await click('[data-action="fight"][data-id="kobold"]');
    log(screen() === 'battle' && d.querySelectorAll('#board .cell').length === 91, 'arena fight opens the hex battlefield');
    log(!!q('.tester') && q('#combat-log').textContent.includes('Round 1'), 'tester controls and log are shown');
    // Pillars and terrain are random and can block a throw; rebuild the arena flat and without pillars so this check is repeatable.
    log(q('#tester-terrain').value === 'random' && !!st().combat.grid.terrain, 'the beta also rolls a random layout by default');
    q('#tester-pillars').checked = false;
    q('#tester-terrain').value = 'flat';
    await click('[data-action="rebuild"]');
    await wait(300);
    log(st().combat.grid.pillars.length === 0 && st().combat.grid.terrain === 'flat', 'tester can rebuild the arena flat and without pillars');
    // Walk to the blue hex nearest the kobold.
    const foe = st().combat.grid.pos.e1;
    const dist = k => { const [kq, kr] = k.split(',').map(Number); return (Math.abs(kq - foe.q) + Math.abs(kr - foe.r) + Math.abs(kq + kr - foe.q - foe.r)) / 2; };
    const key = [...d.querySelectorAll('.cell.reach')].map(c => c.dataset.key).sort((a, b) => dist(a) - dist(b))[0];
    await click(`[data-key="${key}"]`);
    await wait(400);
    const pos = st().combat.grid.pos.you;
    log(st().combat.turn.moved && `${pos.q},${pos.r}` === key, 'clicking a blue hex moves you');
    await click('[data-action="throwPick"][data-id="throwing-axe"]');
    log(st().combat.throwPick === 'throwing-axe' && q('[data-action="throwPick"][data-id="throwing-axe"]').classList.contains('on'), 'the Throw picker chooses throwing axes');
    const throwAt = q('.cell.throwable');
    if (throwAt && !st().combat.over) {
      await click(`[data-key="${throwAt.dataset.key}"]`);
      await wait(500);
      // If the axe kills the kobold, the fight is won and the axe is gathered up again.
      const won = st().combat.over && /You gather up the Throwing Axe/.test(q('#combat-log').textContent);
      log((st().combat.thrown.length === 1 || won) && /You throw your Throwing Axe|Your Throwing Axe flies past/.test(q('#combat-log').textContent), 'clicking a dashed enemy throws a throwing axe');
      if (won) {
        await click('[data-action="again"]');
        await wait(300);
      }
    } else {
      const s = st();
      const why = s.combat.over ? 'fight over' : s.combat.enemies.map(e => `${e.uid}: ${rangeProfile(s, e.uid).reason ?? 'ok'}`).join('; ');
      log(s.combat.over, `an enemy is in throwing range after moving (${why}; you at ${JSON.stringify(s.combat.grid.pos.you)}, pillars ${s.combat.grid.pillars.join(' ')})`);
    }
    await click('[data-action="endTurn"]');
    await wait(600);
    log(st().combat.round === 2 || st().combat.over, 'end turn plays the round');
    const enemiesBefore = st().combat.enemies.length;
    await click('[data-action="addEnemy"]');
    await wait(300);
    log(st().combat.enemies.length === enemiesBefore + 1 || st().combat.over, 'tester can add an enemy');
    const rebuildAs = async layout => {
      q('#tester-terrain').value = layout;
      await click('[data-action="rebuild"]');
      await wait(300);
    };
    if (!st().combat.over) {
      log(d.querySelectorAll('.level-shade').length === 0, 'a default arena is flat');
      await rebuildAs('ziggurat');
      log(st().settings.battle.terrain === 'ziggurat' && Object.keys(st().combat.grid.height).length > 0
        && d.querySelectorAll('.level-shade').length > 0 && [...d.querySelectorAll('.level-mark')].some(m => m.textContent === '3'),
      'tester can rebuild the arena as a ziggurat, and the board shows its levels');
      await rebuildAs('ledges');
      log(d.querySelectorAll('.cliff').length > 0 && q('#tester-terrain').value === 'ledges', 'ledges show cliff edges, and the picker keeps the layout');

      // Climb the Ziggurat through the real screen: each turn, move to the highest blue hex you can reach (nearest the middle).
      await rebuildAs('ziggurat');
      const cellLevel = k => st().combat.grid.height[k] ?? 0;
      const fromMiddle = k => { const [kq, kr] = k.split(',').map(Number); return (Math.abs(kq) + Math.abs(kr) + Math.abs(kq + kr)) / 2; };
      let climbed = 0;
      for (let turn = 0; turn < 6 && !st().combat.over && climbed < 1; turn++) {
        await click('[data-action="heal"]');
        await wait(150);
        const options = [...d.querySelectorAll('.cell.reach')].map(c => c.dataset.key)
          .sort((a, b) => cellLevel(b) - cellLevel(a) || fromMiddle(a) - fromMiddle(b));
        if (options.length) {
          await click(`[data-key="${options[0]}"]`);
          await wait(300);
        }
        const at = st().combat.grid.pos.you;
        climbed = cellLevel(`${at.q},${at.r}`);
        if (!climbed && !st().combat.over) {
          await click('[data-action="endTurn"]');
          await wait(400);
        }
      }
      log(climbed >= 1 || st().combat.over, `you climb onto the Ziggurat within a few turns (level ${climbed})`);

      // Climbing through the real screen: a flat floor, a hill painted beside you, the move preview, then the climb.
      await rebuildAs('flat');
      const me = st().combat.grid.pos.you;
      const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
      const besideMe = DIRS.map(([dq, dr]) => `${me.q + dq},${me.r + dr}`).filter(k => q(`.cell.reach[data-key="${k}"]`));
      const hill = besideMe[0];
      await click('[data-action="paint"][data-mode="raise"]');
      await click(`[data-key="${hill}"]`);
      await click('[data-action="paint"][data-mode=""]');
      log(st().combat.grid.height[hill] === 1 && !!q(`.level-shade`), 'the Paint height tool raises a hex');
      const m = moveStats(st().character);
      q(`[data-key="${hill}"]`).dispatchEvent(new MouseEvent('mouseover', { bubbles: true }));
      await wait(150);
      const preview = q('#hint').textContent;
      log(preview.includes(`Moving here costs ${1 + m.climbCost} of your ${m.mp} movement`), `hovering the hill previews the climb's cost (${preview})`);
      await click(`[data-key="${hill}"]`);
      await wait(300);
      const at = st().combat.grid.pos.you;
      log(`${at.q},${at.r}` === hill && st().combat.turn.moved, 'clicking it climbs onto the hill');
      // A neighbor painted 2 levels above the hill: a thin dashed edge if you can climb 2 levels a step (Str 18+), else a full cliff.
      const ledge = DIRS.map(([dq, dr]) => `${at.q + dq},${at.r + dr}`).find(k => q(`[data-key="${k}"]`) && !q(`[data-key="${k}"]`).classList.contains('pillar') && k !== `${me.q},${me.r}`);
      await click('[data-action="paint"][data-mode="raise"]');
      for (let i = 0; i < 3; i++) await click(`[data-key="${ledge}"]`);
      await click('[data-action="paint"][data-mode=""]');
      log(st().combat.grid.height[ledge] === 3 && d.querySelectorAll('.cliff').length > 0
        && (d.querySelectorAll('.cliff.climbable').length > 0) === (m.climbMax >= 2),
      `a 2-level edge is drawn as ${m.climbMax >= 2 ? 'climbable' : 'a cliff'} for your Str ${st().character.stats.str}`);
    }
    await click('[data-action="speed"][data-speed="instant"]');
    await click('[data-action="autoFight"]');
    for (let i = 0; i < 300 && !q('[data-action="leave"]'); i++) await wait(100);
    log(!!q('[data-action="leave"]'), `auto-played fight finishes (${st().combat?.result})`);
    await click('[data-action="leave"]');
    log(['town', 'dead', 'captain'].includes(screen()), 'leaving the battle returns to the game');
    log(localStorage.getItem('dimholt.save.auto') === mainBefore, 'the main game save was not touched');

    // Javelins and the sling: buy both, take the sling in hand, and shoot a kobold through the real screen.
    if (screen() === 'town') {
      await click('[data-to="weapons"]');
      const shop = q('#screen').textContent.replace(/\s+/g, ' ');
      log(shop.includes('Javelin') && /Sling.*Shoots stones \(never runs out\): full power to \d hexes/.test(shop),
        'the weaponsmith sells javelins and slings, and says a sling shoots stones');
      await click('[data-action="buy"][data-id="javelin"]');
      await click('[data-action="buy"][data-id="sling"]');
      const slingAt = st().character.weapons.findIndex(x => x.id === 'sling');
      await click(`[data-action="equip"][data-index="${slingAt}"]`);
      log(st().character.weapons.some(x => x.id === 'javelin') && st().character.equipped === slingAt, 'bought a javelin and a sling, and took the sling in hand');
      await click('[data-action="go"][data-to="town"]');
      await click('[data-to="guide"]');
      log(/Slings\. A Sling shoots stones from your hand/.test(q('#screen').textContent.replace(/\s+/g, ' ')), 'the guide explains slings');
      await click('[data-action="go"][data-to="town"]');
      await click('[data-to="arena"]');
      await click('tr[data-id="kobold"]');
      await click('[data-action="fight"][data-id="kobold"]');
      q('#tester-pillars').checked = false;
      q('#tester-terrain').value = 'flat';
      await click('[data-action="rebuild"]');
      await wait(300);
      log(/shoot your Sling at an enemy in range/.test(q('#hint').textContent) && !!q('[data-action="throwPick"][data-id=""]')?.textContent.includes('Shoot your Sling'),
        'with a sling in hand, the hint and the picker offer to shoot it');
      // Close in until the kobold is in range (it comes to you too), then shoot.
      for (let turn = 0; turn < 4 && !q('.cell.throwable') && !st().combat.over; turn++) {
        const foe2 = st().combat.grid.pos.e1;
        const dist2 = k => { const [kq, kr] = k.split(',').map(Number); return (Math.abs(kq - foe2.q) + Math.abs(kr - foe2.r) + Math.abs(kq + kr - foe2.q - foe2.r)) / 2; };
        const step = [...d.querySelectorAll('.cell.reach')].map(c => c.dataset.key).sort((a, b) => dist2(a) - dist2(b))[0];
        if (step) { await click(`[data-key="${step}"]`); await wait(300); }
        if (!q('.cell.throwable')) { await click('[data-action="endTurn"]'); await wait(500); }
      }
      const target = q('.cell.throwable');
      if (target && !st().combat.over) {
        await click(`[data-key="${target.dataset.key}"]`);
        await wait(500);
        const logText = q('#combat-log').textContent;
        log(/Your Sling sends a stone into the Kobold|Your Sling's stone whistles past the Kobold/.test(logText)
          && st().character.equipped === slingAt && !(st().combat.thrown ?? []).length,
        'clicking a dashed enemy shoots a stone, and the sling stays in hand');
      } else {
        log(st().combat.over, 'a kobold comes into sling range');
      }
      if (!st().combat.over) {
        await click('[data-action="surrender"]');
        await wait(300);
      }
      await click('[data-action="leave"]');
      log(screen() === 'town' && st().character.equipped === slingAt, 'leaving the fight keeps the sling in hand');

      // A bow and arrows: buy them, shoot, and gather up the arrows that didn't break.
      await click('[data-to="weapons"]');
      log(/Ammunition/.test(q('#screen').textContent) && /Bow.*Shoots arrows \(sold below\)/.test(q('#screen').textContent.replace(/\s+/g, ' ')),
        'the weaponsmith sells bows, crossbows and ammunition');
      await click('[data-action="buy"][data-id="bow"]');
      await click('[data-action="buyAmmo"][data-id="arrow"]');
      await click('[data-action="buyAmmo"][data-id="arrow"]');
      const bowAt = st().character.weapons.findIndex(x => x.id === 'bow');
      await click(`[data-action="equip"][data-index="${bowAt}"]`);
      log(st().character.ammo.arrow === 20 && st().character.equipped === bowAt, 'bought a bow and 20 arrows, and took the bow in hand');
      await click('[data-action="go"][data-to="town"]');
      await click('[data-to="arena"]');
      await click('tr[data-id="kobold"]');
      await click('[data-action="fight"][data-id="kobold"]');
      q('#tester-pillars').checked = false;
      q('#tester-terrain').value = 'flat';
      await click('[data-action="rebuild"]');
      await wait(300);
      log(/Shoot your Bow, 20 arrows/.test(q('.throw-pick')?.textContent ?? ''), 'the picker shows the bow and its arrows');
      let fired = 0;
      for (let turn = 0; turn < 6 && !st().combat.over && fired < 2; turn++) {
        const shotAt = q('.cell.throwable');
        if (shotAt) {
          await click(`[data-key="${shotAt.dataset.key}"]`);
          await wait(400);
          fired = 20 - st().character.ammo.arrow;
        } else {
          const foe3 = st().combat.grid.pos.e1;
          const dist3 = k => { const [kq, kr] = k.split(',').map(Number); return (Math.abs(kq - foe3.q) + Math.abs(kr - foe3.r) + Math.abs(kq + kr - foe3.q - foe3.r)) / 2; };
          const step = [...d.querySelectorAll('.cell.reach')].map(c => c.dataset.key).sort((a, b) => dist3(a) - dist3(b))[0];
          if (step) { await click(`[data-key="${step}"]`); await wait(300); }
        }
        if (!st().combat.over) { await click('[data-action="endTurn"]'); await wait(500); }
      }
      const arrowLog = q('#combat-log').textContent;
      log(/Your Bow sends an arrow into the Kobold|Your Bow's arrow whistles past the Kobold/.test(arrowLog) && st().character.ammo.arrow < 20,
        `clicking a dashed enemy shoots an arrow, and uses it (${20 - st().character.ammo.arrow} shot)`);
      // What's out on the field: shot and not broken (if the fight is already won, they're back already).
      const before = st();
      const out = before.combat.over ? 0 : (before.combat.ammoOut?.arrow ?? 0);
      const broken = before.combat.over ? null : (before.combat.ammoBroken?.arrow ?? 0);
      if (!before.combat.over) {
        await click('[data-action="surrender"]');
        await wait(300);
      }
      const s3 = st();
      log(s3.character.ammo.arrow === before.character.ammo.arrow + out && (broken === null || s3.character.ammo.arrow === 20 - broken)
        && /You gather up \d+ arrows?|that hit broke/.test(q('#combat-log').textContent),
      `after the fight you gather up every arrow that didn't break (${broken ?? '?'} broke, ${s3.character.ammo.arrow} left)`);
      await click('[data-action="leave"]');
    }
  } catch (err) {
    log(false, err.message);
  }
  log(errors.length === 0, `no page errors${errors.length ? ': ' + errors.join(' | ') : ''}`);
  document.body.dataset.done = 'yes';
});
frame.src = '../index.html?beta=true';
</script>
</body>
</html>
