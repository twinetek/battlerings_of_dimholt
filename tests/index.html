<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battlerings Tests</title>
<style>
  body { font: 14px/1.4 ui-monospace, Consolas, monospace; margin: 16px; background: #fff; color: #111; }
  .pass { color: #1a7f37; } .fail { color: #b3261e; font-weight: bold; }
  table { border-collapse: collapse; margin-top: 12px; }
  td, th { border: 1px solid #ccc; padding: 2px 8px; text-align: right; }
  td:first-child, th:first-child { text-align: left; }
</style>
</head>
<body>
<h1>The Battlerings of Dimholt: rules tests</h1>
<p>Unit checks for the rules, then a balance simulation: for each opponent, the lowest level at which a
  typical gladiator (Str 16, Dex 15, Con 15) with gear they could plausibly afford wins most fights by
  pressing Fight every round, with no potions.</p>
<pre id="out"></pre>
<div id="sim"></div>
<script type="module">
import { setRng, seeded, roll, parse, rangeText } from '../js/engine/dice.js';
import { exposeToPoison, sweatOut } from '../js/rules/poison.js';
import * as Hex from '../js/engine/hex.js';
import * as BF from '../js/rules/battlefield.js';
import { glandPotency, coatingStrength, applyVenom, sellLoot, rollLoot, endArenaVisit, advanceClock, liveCoatings } from '../js/rules/loot.js';
import { readSlot, deleteSlot } from '../js/engine/save.js';
import { MONSTERS } from '../js/data/monsters.js';
import { createCharacter, maxHp, armorClass, gainXp, drainLevel, spendStatPoints, readTome } from '../js/rules/character.js';
import { buyWeapon, buyArmor, buyItem, sellWeapon, stayAtInn, useItemInTown } from '../js/rules/town.js';
import { startCombat, playRound } from '../js/rules/combat.js';
import { newGameState, SAVE_VERSION } from '../js/engine/state.js';
import { reinforcementsDue, setTarget, summonKind } from '../js/rules/combat.js';
import { MONSTER_BY_ID } from '../js/data/monsters.js';
import { XP_FOR_LEVEL, strBonus, dexAc, conHp } from '../js/rules/tables.js';

const out = document.getElementById('out');
let passed = 0, failed = 0;
function check(name, cond) {
  if (cond) passed++; else failed++;
  out.insertAdjacentHTML('beforeend', `<span class="${cond ? 'pass' : 'fail'}">${cond ? 'PASS' : 'FAIL'}</span> ${name}\n`);
}

setRng(seeded(42));

// Dice
check('parse 2d4+1', JSON.stringify(parse('2d4+1')) === '{"n":2,"sides":4,"mod":1}');
check('parse d6', parse('d6').n === 1);
check('rangeText 4d3+4 is 8-16', rangeText('4d3+4') === '8-16');
let lo = 99, hi = 0;
for (let i = 0; i < 2000; i++) { const r = roll('3d6'); lo = Math.min(lo, r); hi = Math.max(hi, r); }
check('3d6 stays in 3-18', lo >= 3 && hi <= 18);

// Hex grid
{
  const o = { q: 0, r: 0 };
  check('hex distance', Hex.distance(o, { q: 3, r: -1 }) === 3 && Hex.distance(o, { q: -2, r: 2 }) === 2);
  check('six neighbors, all at distance 1', Hex.neighbors(o).length === 6 && Hex.neighbors(o).every(n => Hex.distance(o, n) === 1));
  check('hexagon board sizes', Hex.hexagon(1).length === 7 && Hex.hexagon(5).length === 91);
  const board = new Set(Hex.hexagon(3).map(Hex.key));
  const wall = new Set(['1,-1', '1,0', '0,1']);
  const passable = h => board.has(Hex.key(h)) && !wall.has(Hex.key(h));
  check('reachable respects steps', [...Hex.reachable(o, 1, () => true).keys()].length === 7);
  const path = Hex.pathToHex(o, { q: 2, r: 0 }, passable);
  check('path goes around obstacles', path && path.length > 2 && path.every(h => passable(h)) && Hex.equal(path.at(-1), { q: 2, r: 0 }));
  check('path steps are adjacent', path.every((h, i) => Hex.adjacent(i ? path[i - 1] : o, h)));
  const near = Hex.pathToAdjacent(o, { q: 3, r: 0 }, passable);
  check('path to a hex next to a target stops beside it', near && Hex.adjacent(near.at(-1), { q: 3, r: 0 }));
  check('no path through a sealed ring', Hex.pathToHex(o, { q: 3, r: 0 }, h => Hex.distance(o, h) !== 1) === null);
}

// Character
const stats = { str: 16, int: 10, wis: 10, dex: 15, con: 15, cha: 10 };
const c = createCharacter('  ', stats);
check('blank name becomes Derek', c.name === 'Derek');
check('level 1 hp = 10 + con bonus', maxHp(c) === 11 && c.hp === 11);
check('unarmored AC with dex 15 is 9', armorClass(c) === 9);
c.gold = 10000;
check('buy long sword', buyWeapon(c, 'long-sword').ok && c.equipped === 0);
check('buy chain mail', buyArmor(c, 'chain').ok && armorClass(c) === 4);
const g = c.gold;
check('trade in chain for plate', buyArmor(c, 'plate').ok && c.gold === g - (600 - 37));
check('ring of protection', buyItem(c, 'ring-protection-2').ok && armorClass(c) === 0);
check('only best ring counts', buyItem(c, 'ring-protection-1').ok && armorClass(c) === 0);
for (let i = 0; i < 5; i++) buyWeapon(c, 'dagger');
check('weapon limit is 6', !buyWeapon(c, 'dagger').ok);
check('sell equipped weapon re-equips', sellWeapon(c, 0).ok && c.equipped === 0 && c.weapons.length === 5);
const ups = gainXp(c, XP_FOR_LEVEL[3]);
check('gain 2 levels', c.level === 3 && ups.length === 2);
check('drain level', !drainLevel(c).died && c.level === 2 && c.hpRolls.length === 2);
buyItem(c, 'tome-con');
const before = maxHp(c);
useItemInTown(c, c.items.length - 1);
check('tome of con raises max hp retroactively', maxHp(c) === before + 2 && c.stats.con === 16);

// Stat points
{
  const s = createCharacter('Trainee', { str: 16, int: 10, wis: 10, dex: 15, con: 15, cha: 10 });
  gainXp(s, XP_FOR_LEVEL[5]);
  check('points at levels 2 and 4 only', JSON.stringify(s.statPoints) === '[2,4]');
  check('cannot spend more points than you have', !spendStatPoints(s, { str: 3 }).ok && s.stats.str === 16);
  check('points can go into a stat with no effect', spendStatPoints(s, { cha: 1 }).ok && s.stats.cha === 11 && s.statPoints.length === 1);
  check('oldest point spent first', s.statLog[0].level === 2 && s.statPoints[0] === 4);
  gainXp(s, XP_FOR_LEVEL[9] - s.xp); // levels 6 and 8 add two more points
  check('points bank up', JSON.stringify(s.statPoints) === '[4,6,8]');
  check('training stops at 18', !spendStatPoints(s, { str: 3 }).ok && spendStatPoints(s, { str: 2 }).ok && s.stats.str === 18);
  const hpBefore = maxHp(s);
  check('raising con raises hp retroactively', spendStatPoints(s, { con: 1 }).ok && maxHp(s) === hpBefore + 9 && s.hp === maxHp(s));
  check('tomes go past 18', readTome(s, 'str') && s.stats.str === 19);
  for (let i = 0; i < 10; i++) readTome(s, 'str');
  check('tomes stop at 25', s.stats.str === 25);
  check('strength table reaches 25', strBonus(25).hit === 6 && strBonus(25).dmg === 10 && dexAc(25) === -8 && conHp(25) === 8);

  // Level drain takes back the drained level's point.
  const d = createCharacter('Drained', { str: 15, int: 10, wis: 10, dex: 15, con: 15, cha: 10 });
  gainXp(d, XP_FOR_LEVEL[4]);
  spendStatPoints(d, { str: 1 }); // the level 2 point
  const r1 = drainLevel(d); // lose level 4: its point is unspent
  check('drain takes an unspent point first', r1.lostPoint && d.statPoints.length === 0 && d.stats.str === 16);
  drainLevel(d); // lose level 3: no point
  const r2 = drainLevel(d); // lose level 2: its point raised Strength
  check('drain undoes a spent point', r2.lostStat === 'str' && d.stats.str === 15 && d.statLog[0].revoked);
  readTome(d, 'str');
  check('tome survives drain history', d.stats.str === 16);
  gainXp(d, XP_FOR_LEVEL[2] - d.xp);
  check('re-earning a drained level gives the point back', JSON.stringify(d.statPoints) === '[2]');
}

// Poison
{
  const p = createCharacter('Venom', { str: 12, int: 10, wis: 10, dex: 12, con: 12, cha: 10 });
  setRng(() => 0.99); // every d20 is a 20
  check('poison save resists', exposeToPoison(p, 'giant-spider', 4).resisted && p.poison === 0 && p.poisonRecord['giant-spider'].resisted === 1);
  setRng(() => 0);    // every d20 is a 1
  check('failed save poisons at the dose', exposeToPoison(p, 'giant-spider', 4).strength === 4 && p.poisonSource === 'giant-spider');
  check('stacking takes the higher plus 1', exposeToPoison(p, 'giant-centipede', 2).strength === 5 && p.poisonRecord['giant-spider'].poisoned === 1);
  p.hp = 20; p.poison = 4;
  check('sweat out applies all remaining poison', JSON.stringify(sweatOut(p)) === '{"dmg":10,"lingering":0}' && p.hp === 10);
  p.hp = 5; p.poison = 4;
  check('sweat out stops at 1 hp and lingers', JSON.stringify(sweatOut(p)) === '{"dmg":4,"lingering":3}' && p.hp === 1);

  const ps = newGameState(createCharacter('Ticker', { str: 12, int: 10, wis: 10, dex: 12, con: 12, cha: 10 }));
  ps.character.hp = 999; ps.character.poison = 3;
  startCombat(ps, 'gargoyle');
  const tick = playRound(ps, { type: 'fight' }); // all rolls are 1: everyone misses
  check('poison ticks at the end of a round and fades', tick.some(e => e.t === 'poisonTick' && e.dmg === 3) && ps.character.poison === 2);
  playRound(ps, { type: 'fight' }); playRound(ps, { type: 'fight' });
  check('poison wears off', ps.character.poison === 0);
  ps.character.hp = 2; ps.character.poison = 5;
  playRound(ps, { type: 'fight' });
  check('poison can kill, and the death says so', ps.combat.result === 'death' && ps.combat.cause === 'poison');

  const sc = newGameState(createCharacter('Stung', { str: 12, int: 10, wis: 10, dex: 12, con: 12, cha: 10 }));
  sc.character.hp = 999;
  startCombat(sc, 'giant-scorpion');
  setRng(seeded(7));
  let poisonedOnce = false;
  for (let i = 0; i < 40 && !sc.combat.over; i++) poisonedOnce ||= playRound(sc, { type: 'fight' }).some(e => e.t === 'poisoned');
  check('scorpion sting can poison', poisonedOnce && sc.character.poisonRecord['giant-scorpion'].poisoned > 0);

  const cureState = newGameState(createCharacter('Cured', { str: 12, int: 10, wis: 10, dex: 12, con: 12, cha: 10 }));
  const cc = cureState.character;
  cc.gold = 1000; cc.poison = 3;
  buyItem(cc, 'potion-neutralize-poison');
  check('antidote cures in town', useItemInTown(cc, 0).ok && cc.poison === 0 && cc.items.length === 0);
  check('antidote refuses when not poisoned', buyItem(cc, 'potion-neutralize-poison').ok && !useItemInTown(cc, 0).ok);
  cc.poison = 2;
  check('one night at the inn cures poison at full hp', stayAtInn(cureState, Infinity).ok && cc.poison === 0 && cureState.day === 2);

  // Saves from before poison existed still load.
  const old = newGameState(createCharacter('Old', { str: 12, int: 10, wis: 10, dex: 12, con: 12, cha: 10 }));
  old.version = 1;
  delete old.character.poison; delete old.character.poisonSource; delete old.character.poisonRecord;
  localStorage.setItem('dimholt.save.migtest', JSON.stringify({ format: 'dimholt-save', version: 1, state: old }));
  const loaded = readSlot('migtest');
  deleteSlot('migtest');
  check('version 1 save migrates', loaded && loaded.state.version === SAVE_VERSION && loaded.state.character.poison === 0 && typeof loaded.state.character.poisonRecord === 'object');
  setRng(seeded(42));
}

// Mercenaries and reinforcements
{
  const fresh = () => {
    const st = newGameState(createCharacter('Boss', { str: 16, int: 10, wis: 10, dex: 15, con: 15, cha: 10 }));
    st.character.gold = 100000; st.character.hp = 9999;
    buyWeapon(st.character, 'long-sword-2');
    return st;
  };
  setRng(seeded(11));

  let st = fresh();
  const before = st.character.gold;
  check('hiring pays wages up front', startCombat(st, 'orc', { militia: 2, veteran: 1 }).ok && st.character.gold === before - 170);
  check('crew joins with names', st.combat.allies.length === 3 && st.combat.hired === 3 && st.combat.allies.every(a => a.name && a.hp === a.maxHp));
  st.character.gold = 5;
  check("can't hire what you can't afford", !startCombat(st, 'orc', { champion: 1 }).ok);

  // Mercenaries act on your side.
  st = fresh();
  startCombat(st, 'hill-giant', { knight: 2 });
  let allyActed = false, allyTargeted = false;
  for (let i = 0; i < 30 && !st.combat.over; i++) {
    const ev = playRound(st, { type: 'fight' });
    allyActed ||= ev.some(e => e.t === 'attack' && e.by === 'ally');
    allyTargeted ||= ev.some(e => e.t === 'attack' && e.by === 'enemy' && !e.you);
  }
  check('mercenaries attack', allyActed);
  check('monsters attack mercenaries too', allyTargeted);

  // Solo fights never summon.
  st = fresh();
  startCombat(st, 'kobold');
  st.combat.enemies[0].hp = 1; st.combat.enemies[0].maxHp = 100;
  check('solo fights never summon', JSON.stringify(reinforcementsDue(st)) === '{"now":0,"warn":0}');

  // Below half health: an immediate summon, once, within the cap.
  st = fresh();
  startCombat(st, 'orc', { militia: 1 });
  const main = st.combat.enemies[0];
  main.maxHp = 100; main.hp = 40;
  setRng(() => 0.99); // no random summon on top
  check('below half summons at once', reinforcementsDue(st).now === 1 && st.combat.summon.halfDone);
  check('the half-health summon happens once', reinforcementsDue(st).now === 0);

  // The cap: never more helpers than mercenaries hired.
  st = fresh();
  startCombat(st, 'orc', { militia: 1 });
  st.combat.enemies.push({ uid: 'e9', monsterId: 'orc', name: 'Orc 2', hp: 5, maxHp: 5, summoned: true });
  setRng(() => 0); // the random check always passes
  check('summons are capped at crew size', reinforcementsDue(st).warn === 0);
  st.combat.enemies[1].hp = 0;
  check('room opens when a helper falls', reinforcementsDue(st).warn === 1);
  setRng(seeded(12));

  check('kin, named, and arena summons pick the right kind',
    summonKind(MONSTER_BY_ID.kobold) === 'kobold' && summonKind(MONSTER_BY_ID.wight) === 'ghoul' && summonKind(MONSTER_BY_ID['hill-giant']) !== 'hill-giant');
  check('dragons never call for help', !MONSTER_BY_ID['red-dragon'].calls && !MONSTER_BY_ID['black-dragon'].calls);

  // Every enemy must fall; XP is split; helpers pay no gold.
  st = fresh();
  startCombat(st, 'kobold', { militia: 1 });
  st.combat.enemies.push({ uid: 'e2', monsterId: 'kobold', name: 'Kobold 2', hp: 999, maxHp: 999, breathLeft: 0, regenBlocked: false, main: false, summoned: true, killedBy: null });
  st.combat.enemies[0].hp = 1;
  setTarget(st.combat, 'e1');
  let r = 0;
  while (st.combat.enemies[0].hp > 0 && r++ < 50) playRound(st, { type: 'fight' });
  check('victory waits until every enemy falls', !st.combat.over && st.combat.enemies[1].hp > 0);
  check('your target moves on when it falls', st.combat.target === 'e2');
  st.combat.enemies[1].hp = 1;
  const gold0 = st.character.gold, xp0 = st.character.xp;
  let win = [];
  r = 0;
  while (!st.combat.over && r++ < 50) win = playRound(st, { type: 'fight' });
  const v = win.find(e => e.t === 'victory');
  check('XP is split among the party', v && v.totalXp === 180 && v.party === 2 && st.character.xp - xp0 === 90);
  check("only the chosen opponent's gold is paid", st.character.gold - gold0 === 20);

  // Red Dragon: with help, Captain needs your killing blow.
  st = fresh();
  startCombat(st, 'red-dragon', { champion: 1 });
  st.combat.allies[0].hp = 9999;
  st.combat.enemies[0].hp = 1;
  st.combat.paralyzed = 3; // you can't act, so the Champion lands the blow
  setRng(() => 0.99);
  const dr = playRound(st, { type: 'fight' });
  check('a mercenary killing blow does not make you Captain', dr.some(e => e.t === 'captainDenied') && !st.flags.captain);
  setRng(seeded(13));

  // Breath hits the whole party.
  st = fresh();
  startCombat(st, 'black-dragon', { sellsword: 2 });
  st.combat.allies.forEach(a => { a.hp = 9999; a.maxHp = 9999; });
  setRng(() => 0); // breath chance passes, saves fail
  st.combat.paralyzed = 1;
  const br = playRound(st, { type: 'fight' }).find(e => e.t === 'breath');
  check('breath hits you and every mercenary', br && br.hits.length === 3);
  setRng(seeded(14));

  // Fights saved mid-round in version 2 still load.
  const v2 = newGameState(createCharacter('Mid', { str: 12, int: 10, wis: 10, dex: 12, con: 12, cha: 10 }));
  v2.version = 2;
  v2.combat = { monsterId: 'troll', hp: 20, maxHp: 50, round: 3, paralyzed: 0, breathLeft: 0, regenBlocked: true, over: false, result: null, log: [] };
  localStorage.setItem('dimholt.save.migtest2', JSON.stringify({ format: 'dimholt-save', version: 2, state: v2 }));
  const up = readSlot('migtest2');
  deleteSlot('migtest2');
  const uc = up?.state.combat;
  check('version 2 fight migrates', uc && uc.enemies.length === 1 && uc.enemies[0].hp === 20 && uc.enemies[0].regenBlocked && uc.enemies[0].name === 'Troll' && uc.allies.length === 0);
  setRng(seeded(42));
}

// Loot and venom
{
  const fresh = () => {
    const st = newGameState(createCharacter('Venomist', { str: 16, int: 10, wis: 10, dex: 15, con: 15, cha: 10 }));
    st.character.gold = 100000; st.character.hp = 9999;
    buyWeapon(st.character, 'long-sword');
    buyWeapon(st.character, 'dagger');
    return st;
  };
  let st = fresh();

  setRng(() => 0); // every drop roll succeeds
  check('poisonous monsters drop venom', rollLoot(st, 'wyvern').length === 1 && st.character.loot[0].id === 'wyvern-venom' && st.character.loot[0].potency === 7);
  check('other monsters drop nothing', rollLoot(st, 'orc').length === 0);
  setRng(seeded(21));

  const g = st.character.loot[0];
  advanceClock(st, 19);
  check('venom in the pack holds for 19 ticks', glandPotency(st, g) === 7);
  advanceClock(st, 1);
  check('then fades 1 per 20 ticks', glandPotency(st, g) === 6);
  check('alchemist pays by current potency', JSON.stringify(sellLoot(st, 0)).includes('720') && st.character.loot.length === 0);

  // Applying, stacking, refreshing, the cap.
  st = fresh();
  const give = id => st.character.loot.push({ id, potency: { 'wyvern-venom': 7, 'scorpion-venom': 5, 'spider-venom': 4, 'centipede-venom': 2 }[id], gotAt: st.clock });
  give('wyvern-venom');
  check('apply venom to a weapon', applyVenom(st, 0, 0).ok && st.character.weapons[0].coatings.length === 1 && st.character.loot.length === 0);
  give('scorpion-venom'); applyVenom(st, 0, 0);
  check('different venoms stack on one weapon', liveCoatings(st, st.character.weapons[0]).length === 2);
  advanceClock(st, 2);
  check('coatings fade 1 per tick', liveCoatings(st, st.character.weapons[0]).find(c => c.source === 'wyvern').now === 5);
  give('wyvern-venom'); applyVenom(st, 0, 0);
  check('same venom refreshes to the stronger', liveCoatings(st, st.character.weapons[0]).length === 2
    && liveCoatings(st, st.character.weapons[0]).find(c => c.source === 'wyvern').now === 7);
  give('spider-venom'); applyVenom(st, 0, 0);
  give('centipede-venom');
  check('at most 3 venoms per weapon', !applyVenom(st, 0, 0).ok && st.character.loot.length === 1);
  check('any weapon can be coated, not just the one in hand', applyVenom(st, 0, 1).ok && st.character.weapons[1].coatings.length === 1);
  advanceClock(st, 10);
  check('spent coatings are cleared', st.character.weapons[0].coatings.length === 0);

  // The clock: one tick per arena visit, one per night.
  st = fresh();
  startCombat(st, 'orc'); st.combat = null; startCombat(st, 'orc'); st.combat = null;
  const c0 = st.clock;
  endArenaVisit(st); endArenaVisit(st);
  check('an arena visit is one tick, however many fights', st.clock === c0 + 1);
  st.character.hp = 1;
  stayAtInn(st, 5);
  check('each inn night is one tick', st.clock === c0 + 6);

  // Venom in combat.
  const coat = (state, source, strength) => { state.character.weapons[0].coatings = [{ source, item: `${source}-venom`, strength, appliedAt: state.clock }]; };
  // A level 15 fighter (THAC0 6) hits almost anything; every d20 here is a 7,
  // which lands the hit and fails the Hill Giant's save (8, as a level 9 fighter).
  const veteran = () => { const v = fresh(); gainXp(v.character, XP_FOR_LEVEL[15]); v.character.hp = 9999; return v; };
  st = veteran();
  coat(st, 'wyvern', 6);
  startCombat(st, 'hill-giant');
  st.combat.enemies[0].hp = 9999; st.combat.enemies[0].maxHp = 9999;
  setRng(() => 0.3);
  let ev = playRound(st, { type: 'fight' });
  check('a hit with a coated weapon poisons the monster', ev.some(e => e.t === 'venom' && e.results[0].outcome === 'takes') && st.combat.enemies[0].poison > 0);
  check('poisoned monsters burn at the end of the round', ev.some(e => e.t === 'enemyPoisonTick'));

  st = veteran();
  coat(st, 'giant-scorpion', 5);
  startCombat(st, 'giant-scorpion');
  st.combat.enemies[0].hp = 9999; st.combat.enemies[0].maxHp = 9999;
  ev = playRound(st, { type: 'fight' });
  check("a monster can't be poisoned by its own kind's venom", st.combat.enemies[0].poison === 0 && ev.some(e => e.t === 'venom' && e.results[0].outcome === 'own'));

  st = veteran();
  coat(st, 'wyvern', 6);
  startCombat(st, 'ghoul');
  st.combat.enemies[0].hp = 9999; st.combat.enemies[0].maxHp = 9999;
  ev = playRound(st, { type: 'fight' });
  check('undead are immune to weapon venom', st.combat.enemies[0].poison === 0 && ev.some(e => e.t === 'venomImmune'));

  st = fresh();
  startCombat(st, 'red-dragon');
  st.combat.enemies[0].hp = 9999; st.combat.enemies[0].maxHp = 9999; st.combat.enemies[0].poison = 7; st.combat.enemies[0].breathLeft = 0;
  st.combat.paralyzed = 1;
  ev = playRound(st, { type: 'fight' });
  const tick = ev.find(e => e.t === 'enemyPoisonTick');
  check('dragons resist poison: half damage, rounded up', tick && tick.dmg === 4 && tick.resists && st.combat.enemies[0].poison === 6);
  setRng(seeded(22));

  // Version 3 saves still load.
  const v3 = newGameState(createCharacter('Old', { str: 12, int: 10, wis: 10, dex: 12, con: 12, cha: 10 }));
  v3.version = 3;
  v3.character.weapons = ['long-sword', 'dagger']; v3.character.equipped = 0;
  delete v3.character.loot; delete v3.clock; delete v3.arenaVisit;
  localStorage.setItem('dimholt.save.migtest3', JSON.stringify({ format: 'dimholt-save', version: 3, state: v3 }));
  const up3 = readSlot('migtest3');
  deleteSlot('migtest3');
  const c3 = up3?.state.character;
  check('version 3 save migrates weapons, loot, and the clock',
    c3 && c3.weapons[0].id === 'long-sword' && Array.isArray(c3.weapons[1].coatings) && Array.isArray(c3.loot) && up3.state.clock === 0);
  setRng(seeded(42));
}

// Hex battlefield (beta)
{
  const fresh = () => {

    st.character.gold = 100000; st.character.hp = 9999;

  };
  setRng(seeded(31));
  let st = fresh();
  BF.startBattle(st, 'kobold', { sellsword: 1 }, { radius: 5, pillars: true });
  const cb = st.combat;

  check('battle deploys everyone on distinct hexes', spots.length === 3 && new Set(spots).size === 3);
  check('nobody starts on a pillar or off the board', Object.values(cb.grid.pos).every(h => BF.onBoard(cb, h)));
  check('a battle starts in round 1 with your move', cb.round === 1 && !cb.turn.moved && !cb.turn.acted);
  check('you cannot attack from across the arena', !BF.actYou(st, { type: 'fight', target: 'e1' }).ok);
  const far = [...BF.reachableFor(st, 'you').entries()].find(([, d]) => d === BF.PLAYER_MOVE)?.[0];

  check('only one move per turn', !BF.moveYou(st, Hex.neighbors(cb.grid.pos.you).find(h => BF.onBoard(cb, h))).ok);
  const before = Hex.distance(cb.grid.pos.e1, cb.grid.pos.you);
  BF.endTurn(st);
  check('enemies close in on their turn', cb.over || Hex.distance(cb.grid.pos.e1, cb.grid.pos.you) < before);
  check('the round advances and your turn resets', cb.over || (cb.round === 2 && !cb.turn.moved && !cb.turn.acted));

  // Next to an enemy, you can attack it, once per turn.
  st = fresh();
  BF.startBattle(st, 'hill-giant', {}, { radius: 4, pillars: false });
  st.combat.enemies[0].hp = 9999; st.combat.enemies[0].maxHp = 9999;
  st.combat.grid.pos.e1 = Hex.neighbors(st.combat.grid.pos.you).find(h => BF.onBoard(st.combat, h));
  const atk = BF.actYou(st, { type: 'fight', target: 'e1' });
  check('attack an adjacent enemy', atk.ok && atk.events.some(e => e.t === 'attack' && e.by === 'player'));
  check('only one attack action per turn', !BF.actYou(st, { type: 'fight', target: 'e1' }).ok);

  // Wands reach a target anywhere on the field.
  st = fresh();
  BF.startBattle(st, 'orc', {}, { radius: 5, pillars: false });
  buyItem(st.character, 'wand-magic-missiles');

  check('wands reach distant targets', wand.ok && wand.events.some(e => e.t === 'itemHit'));

  // Tester tools.
  st = fresh();
  BF.startBattle(st, 'orc', {}, { radius: 5, pillars: true });
  BF.testerAddEnemy(st, 'goblin');
  BF.testerAddMerc(st, 'veteran');
  check('tester enemies and mercenaries get places on the field',
    st.combat.enemies.length === 2 && !!st.combat.grid.pos.e2 && st.combat.allies.length === 1 && !!st.combat.grid.pos.a1);
  check('tester mercenaries are not re-hired by "same crew"', Object.keys(st.combat.crew).length === 0);

  // A whole battle plays out.
  st = fresh();
  BF.startBattle(st, 'giant-rat', { militia: 1 }, { radius: 5, pillars: true });
  for (let i = 0; i < 100 && !st.combat.over; i++) {
    BF.autoYou(st);
    if (!st.combat.over) BF.endTurn(st);

  check('an auto-played battle finishes', st.combat.over && st.combat.result === 'victory');

}

// ---- Balance simulation ----
// Gear a gladiator might own by the time they reach each opponent.
const GEAR = [
  ['giant-rat', 'long-sword', 'leather', null], ['bugbear', 'long-sword', 'chain', null], ['minotaur', 'bastard-sword', 'splint', null],
  ['gargoyle', 'long-sword-1', 'plate', null], ['quickling', 'long-sword-1', 'plate', 'ring-protection-1'],
  ['hill-giant', 'long-sword-2', 'field-plate', 'ring-protection-2'], ['earth-elemental', 'long-sword-2', 'full-plate', 'ring-protection-3'],
  ['black-dragon', 'long-sword-3', 'full-plate-1', 'ring-protection-3'], ['red-dragon', 'long-sword-3', 'full-plate-2', 'ring-protection-3'],
].map(([id, ...rest]) => [MONSTERS.findIndex(m => m.id === id), ...rest]);
const gearFor = i => GEAR.filter(([k]) => k <= i).pop();

// coatings: [[venom source, strength], ...] applied to the weapon in hand.
function simulate(mi, level, crew = {}, trials = 300, coatings = []) {
  let wins = 0, summoned = 0, xp = 0, rounds = 0, envenomed = 0;
  const [, w, a, ring] = gearFor(mi);
  for (let t = 0; t < trials; t++) {
    const s = newGameState(createCharacter('Sim', stats));
    const ch = s.character;
    ch.gold = 1e6;
    buyWeapon(ch, w); buyArmor(ch, a); if (ring) buyItem(ch, ring);
    if (level > 1) gainXp(ch, XP_FOR_LEVEL[level]);
    ch.hp = maxHp(ch);
    ch.weapons[0].coatings = coatings.map(([source, strength]) => ({ source, item: `${source}-venom`, strength, appliedAt: s.clock }));
    const xpBefore = ch.xp;
    startCombat(s, MONSTERS[mi].id, crew);
    let n = 0, tookHold = false;
    while (!s.combat.over && n++ < 300) {
      const ev = playRound(s, { type: 'fight' }); // always play the round; don't short-circuit it away
      if (ev.some(e => e.t === 'venom' && e.results.some(r => r.outcome === 'takes'))) tookHold = true;
    }
    if (s.combat.result === 'victory') { wins++; xp += ch.xp - xpBefore; rounds += s.combat.round; }
    if (tookHold) envenomed++;
    summoned += s.combat.enemies.length - 1;
  }
  return {
    win: wins / trials, summoned: summoned / trials, xp: wins ? Math.round(xp / wins) : 0,
    rounds: wins ? rounds / wins : 0, envenomed: envenomed / trials,
  };
}
const winRate = (mi, level) => simulate(mi, level).win;

const rows = MONSTERS.map((m, i) => {
  const cells = [];
  let first50 = '-', first80 = '-';
  for (let L = 1; L <= 16; L++) {
    const w = winRate(i, L);
    if (first50 === '-' && w >= 0.5) first50 = L;
    if (first80 === '-' && w >= 0.8) { first80 = L; break; }
  }
  const [, w, a, ring] = gearFor(i);
  return `<tr><td>${m.name}</td><td>${first50}</td><td>${first80}</td><td>${w}, ${a}${ring ? ', ' + ring : ''}</td></tr>`;
}).join('');
document.getElementById('sim').innerHTML =
  `<table id="balance"><thead><tr><th>Opponent</th><th>Level for 50%</th><th>Level for 80%</th><th>Gear assumed</th></tr></thead><tbody>${rows}</tbody></table>`;

// ---- Hiring simulation ----
// Two levels below each opponent's solo 50% level, with no crew, then with 1
// and 2 mercenaries of a tier suited to that part of the list.
const TIER_FOR = i => (i < 5 ? 'militia' : i < 9 ? 'sellsword' : i < 15 ? 'veteran' : i < 20 ? 'knight' : 'champion');
const firstFifty = [...document.querySelectorAll('#balance tbody tr')].map(tr => Number(tr.cells[1].textContent) || 16);
const hireRows = MONSTERS.map((m, i) => {
  const level = Math.max(1, firstFifty[i] - 2);
  const tier = TIER_FOR(i);
  const solo = simulate(i, level, {}, 200);
  const one = simulate(i, level, { [tier]: 1 }, 200);
  const two = simulate(i, level, { [tier]: 2 }, 200);
  const pct = x => `${Math.round(x.win * 100)}%`;
  return `<tr><td>${m.name}</td><td>${level}</td><td>${tier}</td><td>${pct(solo)}</td><td>${pct(one)} (${one.summoned.toFixed(1)})</td><td>${pct(two)} (${two.summoned.toFixed(1)})</td><td>${solo.xp} / ${one.xp} / ${two.xp}</td></tr>`;
}).join('');
document.getElementById('sim').insertAdjacentHTML('beforeend',
  `<h2>Hiring help</h2><p>Win rate two levels below the solo 50% level. In brackets: average summoned helpers per fight. Last column: XP you earn per win (solo / 1 merc / 2 mercs).</p>
   <table id="hiring"><thead><tr><th>Opponent</th><th>Level</th><th>Tier</th><th>Solo</th><th>+1 merc</th><th>+2 mercs</th><th>Your XP per win</th></tr></thead><tbody>${hireRows}</tbody></table>`);
// ---- Venom simulation ----
// Same levels as the hiring table (two below the solo 50% level), fighting
// alone with a plain weapon, then with each coating at full strength.
const VENOMS = [
  ['Spider 4', [['giant-spider', 4]]],
  ['Scorpion 5', [['giant-scorpion', 5]]],
  ['Wyvern 7', [['wyvern', 7]]],
  ['Wyvern 7 + Scorpion 5', [['wyvern', 7], ['giant-scorpion', 5]]],
];
const gains = VENOMS.map(() => []);
const venomRows = MONSTERS.map((m, i) => {
  const level = Math.max(1, firstFifty[i] - 2);
  const plain = simulate(i, level, {}, 200);
  const cell = r => `${Math.round(r.win * 100)}%${r.rounds ? ` · ${r.rounds.toFixed(1)} rds` : ''}`;
  const coated = VENOMS.map(([, coatings], k) => {
    const r = simulate(i, level, {}, 200, coatings);
    gains[k].push(r.win - plain.win);
    return `<td>${cell(r)}<span class="muted"> (${Math.round(r.envenomed * 100)}% poisoned)</span></td>`;
  }).join('');
  const note = m.immune.includes('poison') ? 'immune' : m.resist.includes('poison') ? 'resists' : m.loot.length ? 'own venom immune' : '';
  return `<tr><td>${m.name}${note ? ` <span class="muted">(${note})</span>` : ''}</td><td>${level}</td><td>${cell(plain)}</td>${coated}</tr>`;
}).join('');
const avgGain = k => `${gains[k].reduce((a, b) => a + b, 0) / gains[k].length >= 0 ? '+' : ''}${Math.round(100 * gains[k].reduce((a, b) => a + b, 0) / gains[k].length)}`;
document.getElementById('sim').insertAdjacentHTML('beforeend',
  `<h2>Coated weapons</h2>
   <p>Solo, two levels below the solo 50% level. Each cell: win rate · average rounds to win (in brackets: share of fights where the venom took hold at least once).
     Coatings are fresh; in play they fade by 1 every arena visit and every inn night.</p>
   <table id="venom"><thead><tr><th>Opponent</th><th>Level</th><th>Plain weapon</th>${VENOMS.map(([name]) => `<th>${name}</th>`).join('')}</tr></thead>
   <tbody>${venomRows}</tbody>
   <tfoot><tr><th colspan="3">Average change in win rate (points)</th>${VENOMS.map((_, k) => `<th>${avgGain(k)}</th>`).join('')}</tr></tfoot></table>`);
document.body.dataset.done = 'yes';
</script>
